[project]
name = "smallerer"
version = "0.1.0"
description = "把文档文件夹编译成给 AI 助手当 context 的文本库"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "pathspec>=0.12",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
smlr = "smallerer.cli:main"
smallerer = "smallerer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smallerer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
